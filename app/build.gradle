plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.personal.tempstatusbar'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.tempstatusbar"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs += ['../icons', 'src/main/assets']
        }
    }

    // Forces ../icons/AppIcon.png as the real Android Launcher & Installer Icon
    preBuild.doFirst {
        def customAppIcon = file('../icons/AppIcon.png')
        if (customAppIcon.exists()) {
            // 1. Delete adaptive icon XML folders (mipmap-anydpi-v26) that override PNGs with the fire icon
            def resDir = file("src/main/res")
            if (resDir.exists()) {
                resDir.listFiles()?.each { subDir ->
                    if (subDir.isDirectory() && subDir.name.startsWith("mipmap-anydpi")) {
                        subDir.deleteDir()
                    }
                }
            }

            // 2. Copy AppIcon.png into all mipmap and drawable folders
            ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi', 'drawable'].each { dirName ->
                def targetDir = file("src/main/res/${dirName}")
                if (!targetDir.exists()) {
                    targetDir.mkdirs()
                }
                targetDir.listFiles()?.each { existingFile ->
                    if (existingFile.name.startsWith("ic_launcher")) {
                        existingFile.delete()
                    }
                }
                copy {
                    from customAppIcon
                    into targetDir
                    rename { 'ic_launcher.png' }
                }
                copy {
                    from customAppIcon
                    into targetDir
                    rename { 'ic_launcher_round.png' }
                }
            }

            // 3. Ensure AndroidManifest.xml points to @mipmap/ic_launcher instead of the fire icon
            def manifestFile = file("src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def text = manifestFile.getText("UTF-8")
                text = text.replaceAll('android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"')
                text = text.replaceAll('android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"')
                manifestFile.write(text, "UTF-8")
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

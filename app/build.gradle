plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.personal.tempstatusbar'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.tempstatusbar"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
// Automatically bundles TempStatusBar/icons/ (preserving capital/small letters) and sets AppIcon.png as the App Drawer Icon
android.sourceSets.main.assets.srcDirs += ['../icons']

tasks.register('syncCustomAppIcon', Copy) {
    from('../icons/AppIcon.png')
    into('src/main/res/drawable')
    rename { 'ic_launcher_custom.png' }
}
preBuild.dependsOn(syncCustomAppIcon)

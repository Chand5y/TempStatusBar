plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.personal.tempstatusbar'
    compileSdk 34

    defaultConfig {
        applicationId "com.personal.tempstatusbar"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "2.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            if (file('../Icons').exists()) {
                assets.srcDirs += ['../Icons']
            }
            if (file('../icons').exists()) {
                assets.srcDirs += ['../icons']
            }
            assets.srcDirs += ['src/main/assets']
        }
    }

    preBuild.doFirst {
        def customAppIcon = file('../Icons/AppIcon.png').exists() ? file('../Icons/AppIcon.png') : file('../icons/AppIcon.png')
        if (customAppIcon.exists()) {
            def resDir = file("src/main/res")
            if (resDir.exists()) {
                resDir.listFiles()?.each { subDir ->
                    if (subDir.isDirectory() && subDir.name.startsWith("mipmap-anydpi")) {
                        subDir.deleteDir()
                    }
                }
            }

            ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi', 'drawable'].each { dirName ->
                def targetDir = file("src/main/res/${dirName}")
                if (!targetDir.exists()) {
                    targetDir.mkdirs()
                }
                targetDir.listFiles()?.each { existingFile ->
                    if (existingFile.name.startsWith("ic_launcher")) {
                        existingFile.delete()
                    }
                }
                copy {
                    from customAppIcon
                    into targetDir
                    rename { 'ic_launcher.png' }
                }
                copy {
                    from customAppIcon
                    into targetDir
                    rename { 'ic_launcher_round.png' }
                }
            }
        }

        def manifestFile = file("src/main/AndroidManifest.xml")
        if (manifestFile.exists()) {
            def text = manifestFile.getText("UTF-8")
            text = text.replaceAll('android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"')
            text = text.replaceAll('android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"')
            if (!text.contains("QUERY_ALL_PACKAGES")) {
                text = text.replace("<application", "<uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" />\n    <application")
            }
            if (!text.contains("TurboTileService")) {
                def turboServiceXml = """
        <service
            android:name=".TurboTileService"
            android:exported="true"
            android:label="Turbo Mode"
            android:icon="@mipmap/ic_launcher"
            android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
            <intent-filter>
                <action android:name="android.service.quicksettings.action.QS_TILE" />
            </intent-filter>
        </service>
    </application>"""
                text = text.replace("</application>", turboServiceXml)
            }
            manifestFile.write(text, "UTF-8")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
